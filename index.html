<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI MIDI</title>
    <link rel="shortcut icon" href="./assets/images/bateria.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <h1>SENAI MIDI</h1>

    <section class="teclado">
        <button  class="tecla">Pom</button>
        <button  class="tecla">Clap</button>
        <button  class="tecla">Tim</button>
        
        <button  class="tecla">Puff</button>
        <button  class="tecla">Splash</button>
        <button  class="tecla">Toim</button>
        
        <button  class="tecla">Psh</button>
        <button  class="tecla">Tic</button>
        <button  class="tecla">Tom</button>
    </section>

    <audio src="./assets/sounds/keyq.wav" id="som_tecla_pom"></audio>
    <audio src="./assets/sounds/keyw.wav"></audio>
    <audio src="./assets/sounds/keye.wav"></audio>
    
    <audio src="./assets/sounds/keya.wav"></audio>
    <audio src="./assets/sounds/keys.wav"></audio>
    <audio src="./assets/sounds/keyd.wav"></audio>
    
    <audio src="./assets/sounds/keyz.wav"></audio>
    <audio src="./assets/sounds/keyx.wav"></audio>
    <audio src="./assets/sounds/keyc.wav"></audio>

    <script src="./script/app.js"></script>

</html>
